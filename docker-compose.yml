version: '3.1'

services:
    krayin-php-apache:
        build:
            args:
                container_project_path: /var/www/html/
                uid: 1000
                user: $USER
            context: .
            dockerfile: ./Dockerfile
        image: krayin-php-apache
        restart: unless-stopped
        ports:
            - 80:80
        volumes:
            - .:/var/www/html/krayin
        networks:
            - krayin-network
        depends_on:
            - krayin-mysql

    krayin-mysql:
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        restart: unless-stopped
        environment:
            MYSQL_ROOT_HOST: '%'
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - ./.configs/mysql-data:/var/lib/mysql/
        networks:
            - krayin-network

    krayin-phpmyadmin:
        image: phpmyadmin:latest
        restart: unless-stopped
        environment:
            PMA_HOST: krayin-mysql
            PMA_USER: root
            PMA_PASSWORD: root
        networks:
            - krayin-network

networks:
    krayin-network:
        driver: bridge

volumes:
    mysql-data: